---
layout: default
---
<div class="page-head">
  <div class="wrap">
    {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif -%}
    <h1>{{ page.title }}</h1>
    {%- if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif -%}
  </div>
</div>
<div class="wrap {% unless page.wide %}wrap-prose{% endunless %}">
  <div class="prose">
    {{ content }}
  </div>
</div>
