# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
permalink: /blog/:title/
date_format: "%B %-d, %Y"

# Render LinkedIn posts as LinkedIn's own embed iframes instead of text cards.
# Heavier, and only works for public posts, so it is off by default. See SETUP.md.
linkedin_embed: false

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: /feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - SETUP.md
  - UNLICENSE.txt
  - scripts
  - vendor
  - .github

defaults:
  - scope: {path: ""}
    values: {layout: "page"}
  - scope: {path: "", type: "posts"}
    values: {layout: "post"}
