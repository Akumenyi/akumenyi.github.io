# ---------------------------------------------------------------------------
# Site identity
# ---------------------------------------------------------------------------
title: "Kwesi A. Quagraine"
subtitle: "Climate Research Scientist"
tagline: "Climate extremes, solar geoengineering and the regional detail that decisions actually need."
description: "Kwesi A. Quagraine, PhD - Chief Scientist of the Climate Vulnerable Forum and V20 (CVF-V20), and Visiting Scientist at the NSF National Center for Atmospheric Research (NSF-NCAR), Boulder, Colorado. Climate modelling, climate extremes, stratospheric aerosol injection and tropical meteorology."
author: "Kwesi A. Quagraine"
email: "kq@cvfv20.org"
url: "https://akumenyi.github.io"
lang: "en"

# The person behind the site. Used for the header, the footer and the
# schema.org Person block that tells search engines and scholarly indexes who
# this is, and which ORCID record the work belongs to.
profile:
  given_name: "Kwesi"
  middle_initial: "A."
  family_name: "Quagraine"
  honorific_suffix: "PhD"
  # Primary appointment.
  role: "Chief Scientist"
  affiliation: "Climate Vulnerable Forum & V20 (CVF-V20)"
  affiliation_short: "CVF-V20"
  affiliation_url: "https://cvfv20.org/"
  # Drop the real logo in as assets/img/cvf-v20-logo.{svg,png,jpg,webp} and it
  # replaces the text wordmark automatically -- no config change needed.
  # SVG is sharpest; a transparent PNG is fine. The mark is presented on a white
  # plate so dark logo text stays legible against the dark theme.
  affiliation_logo: "/assets/img/cvf-v20-logo"
  affiliation_wordmark: "CVF·V20"
  # Concurrent appointment. Leave `secondary_role` blank to drop it site-wide.
  secondary_role: "Visiting Scientist"
  secondary_affiliation: "NSF National Center for Atmospheric Research (NSF-NCAR)"
  secondary_affiliation_short: "NSF NCAR"
  secondary_affiliation_url: "https://ncar.ucar.edu/"
  secondary_affiliation_logo: "/assets/img/nsf-ncar-logo"
  secondary_affiliation_wordmark: "NSF NCAR"
  location: "Boulder, Colorado, USA"
  orcid: "0000-0002-7887-6040"
  scholar_id: "hoI1ZjkAAAAJ"
  photo: "/assets/img/kwesi-quagraine.jpg"
  cv: "/cv_kwesi_a_quagraine_spring2025.pdf"

# ---------------------------------------------------------------------------
# Navigation and links
# ---------------------------------------------------------------------------
navigation:
  - {url: "/", title: "Home"}
  - {url: "/research/", title: "Research"}
  - {url: "/publications/", title: "Publications"}
  - {url: "/blog/", title: "Blog"}
  - {url: "/projects/", title: "Projects & Grants"}
  - {url: "/updates/", title: "Updates"}
  - {url: "/cv_kwesi_a_quagraine_spring2025.pdf", title: "CV", external: true}

profiles:
  - {title: "Google Scholar", short: "Scholar", icon: "scholar", url: "https://scholar.google.com/citations?user=hoI1ZjkAAAAJ&hl=en", handle: "hoI1ZjkAAAAJ"}
  - {title: "ORCID", short: "ORCID", icon: "orcid", url: "https://orcid.org/0000-0002-7887-6040", handle: "0000-0002-7887-6040"}
  - {title: "LinkedIn", short: "LinkedIn", icon: "linkedin", url: "https://www.linkedin.com/in/kwesi-a-quagraine-12855153/", handle: "kwesi-a-quagraine"}
  - {title: "ResearchGate", short: "ResearchGate", icon: "researchgate", url: "https://www.researchgate.net/profile/Kwesi-Quagraine-3", handle: "Kwesi-Quagraine-3"}
  - {title: "GitHub", short: "GitHub", icon: "github", url: "https://github.com/Akumenyi", handle: "Akumenyi"}
  - {title: "X", short: "X", icon: "x", url: "https://twitter.com/pkdilly", handle: "pkdilly"}

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
permalink: /blog/:title/
date_format: "%B %-d, %Y"

# Render LinkedIn posts as LinkedIn's own embed iframes instead of text cards.
# Heavier, and only works for public posts, so it is off by default. See SETUP.md.
# Warming-stripes backdrop shown when a page names no country of its own, or
# names one that has not been rendered yet. Slugs come from _data/cvf_members.yml.
stripes_default: "global"

linkedin_embed: false

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: /feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - SETUP.md
  - UNLICENSE.txt
  - scripts
  - vendor
  - .github

defaults:
  - scope: {path: ""}
    values: {layout: "page"}
  - scope: {path: "", type: "posts"}
    values: {layout: "post"}
