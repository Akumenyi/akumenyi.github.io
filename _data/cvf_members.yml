# ---------------------------------------------------------------------------
# Countries whose warming stripes are rendered on the site.
#
# `scripts/warming_stripes.py` turns each entry into an SVG under
# assets/img/stripes/ using real annual temperature anomalies from Berkeley
# Earth -- the same source #ShowYourStripes uses. Nothing is drawn from
# invented data: if a country cannot be fetched, it simply does not appear.
#
#   slug      file name and the id pages refer to in front matter
#   name      label shown on the site
#   region    grouping label on the home page
#   berkeley  Berkeley Earth's country slug, if it differs from `slug`
#   url       full override, for a country whose file lives somewhere else
#   feature   include in the home-page grid
#
# PLEASE CHECK THE MEMBERSHIP LIST. It was seeded from widely reported CVF
# membership and has not been verified against the Forum's own roster. Adding
# or removing a country here is all that is needed -- the site follows.
# ---------------------------------------------------------------------------

- slug: global
  name: "Global land"
  region: "Global"
  url: "https://berkeley-earth-temperature.s3.us-west-1.amazonaws.com/Global/Complete_TAVG_complete.txt"
  feature: true

