# Pinned / hand-added LinkedIn posts.
#
# The site renders `_data/linkedin.json`, which `scripts/update_linkedin.py`
# builds from (a) any posts listed here and (b) the feed URL in the
# LINKEDIN_FEED_URL repository secret. Entries here are always kept and are
# shown first when `pinned: true`.
#
# The only required field is `url` -- paste the "Copy link to post" URL from
# LinkedIn and the script works out the activity URN so the real post embeds.
